<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Isometric Theme Park Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <div class="brand">
          <div class="brand-logo" aria-hidden="true">
            <span class="pixel-heart"></span>
          </div>
          <div class="brand-text">
            <h1>Pixel Park</h1>
            <p class="subtitle">かわいい★テーマパーク経営</p>
          </div>
        </div>

        <div class="tools" id="tools"></div>

        <div class="stats">
          <div><span>🗓 ラウンド</span><strong id="round">1</strong></div>
          <div><span>💰 資金</span><strong id="funds">0</strong></div>
          <div><span>🧍 来園者</span><strong id="visitors">0</strong></div>
          <div><span>✨ 清潔さ</span><strong id="cleanliness">0</strong></div>
          <div><span>⏳ 待ち行列</span><strong id="queue">0</strong></div>
          <div><span>💖 満足度</span><strong id="satisfaction">0</strong></div>
        </div>

        <button id="nextRound" class="primary">▶ 次ラウンドへ</button>

        <div class="rotation-controls">
          <button id="rotateLeft" class="rotate-btn" title="左回転 (Q)">↺ Q</button>
          <button id="rotateRight" class="rotate-btn" title="右回転 (E)">↻ E</button>
        </div>

        <p class="hint">左クリックで配置 / 撤去。右ドラッグ・WASD・ホイールで移動。Q / E で3D回転。</p>
      </aside>

      <main class="viewport">
        <canvas id="parkCanvas" width="1280" height="800" aria-label="Theme park map"></canvas>
      </main>
    </div>

    <script src="./src/game-logic.js"></script>
    <script src="./src/isometric-utils.js"></script>
    <script src="./src/game.js"></script>
  </body>
</html>
