name: Mark PR ready for review

on:
  workflow_run:
    workflows: ["CI", "CodeQL"]
    types: [completed]

jobs:
  mark-ready:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Mark draft PR ready for review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR_NUMBER=$(gh pr list --repo "$REPO" --search "$HEAD_SHA" --state open --json number,isDraft -q '.[] | select(.isDraft == true) | .number' | head -n 1)

          if [ -z "$PR_NUMBER" ]; then
            echo "No draft PR found for sha $HEAD_SHA"
            exit 0
          fi

          PR_ID=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json id -q .id)

          gh api graphql -f query='
            mutation($pullRequestId:ID!) {
              markPullRequestReadyForReview(input:{pullRequestId:$pullRequestId}) {
                pullRequest { number isDraft }
              }
            }' -F pullRequestId="$PR_ID"